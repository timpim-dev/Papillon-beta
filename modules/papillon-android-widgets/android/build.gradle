apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.papillonandroidwidgets'
version = '1.0.0'

android {
  namespace "expo.modules.papillonandroidwidgets"

  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "com.google.android.gms:play-services-wearable:18.2.0"
}
