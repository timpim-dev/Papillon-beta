name: Papillon + Release APKs

on:
  push:
    branches:
      - "beta-*"
    tags:
      - "v*"
      - "plus-*"
      - "beta-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release (optionnel, ex: v8.6.3-plus)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: papillon-plus-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    if: github.repository == 'timpim-dev/Papillon-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: bun install

      - name: Create secrets.json
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          jq -n \
            --arg api_key "$POSTHOG_API_KEY" \
            --arg host "$POSTHOG_HOST" \
            '{POSTHOG_API_KEY: $api_key, POSTHOG_HOST: $host}' > secrets.json

      - name: Prebuild Android
        run: bunx expo prebuild --platform android --clean

      - name: Configure optional shared keystore
        env:
          BETA_KEYSTORE: ${{ secrets.BETA_KEYSTORE }}
          BETA_KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
          BETA_KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
          BETA_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
        run: |
          if [ -n "$BETA_KEYSTORE" ]; then
            echo "$BETA_KEYSTORE" | base64 --decode > android/app/release.keystore
            PASS="${BETA_KEYSTORE_PASSWORD:-android}"
            ALIAS="${BETA_KEY_ALIAS:-androiddebugkey}"
            KEYPASS="${BETA_KEY_PASSWORD:-$PASS}"
            for cfg in android/app/build.gradle native/wear/build.gradle; do
              sed -i -E "s|storeFile .*debug\.keystore.*|storeFile rootProject.file(\"app/release.keystore\")|" "$cfg"
              sed -i -E "s|storePassword ['\"]android['\"]|storePassword \"$PASS\"|" "$cfg"
              sed -i -E "s|keyAlias ['\"]androiddebugkey['\"]|keyAlias \"$ALIAS\"|" "$cfg"
              sed -i -E "s|keyPassword ['\"]android['\"]|keyPassword \"$KEYPASS\"|" "$cfg"
            done
          fi

      - name: Configure Gradle
        run: |
          chmod +x android/gradlew
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
            echo "android.enable16KbPageSizes=true"
          } >> android/gradle.properties

      - name: Build Phone & Wear APKs
        run: cd android && ./gradlew :app:assembleRelease :wear:assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/release/app-release.apk release-apks/papillon-plus-phone.apk
          cp native/wear/build/outputs/apk/release/wear-release.apk release-apks/papillon-plus-wear.apk

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-android-apks
          path: release-apks/*.apk

  build-ios:
    if: github.repository == 'timpim-dev/Papillon-beta'
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify Xcode and CocoaPods
        run: |
          ls -la /Applications/Xcode* || true
          xcodebuild -version
          command -v pod >/dev/null || brew install cocoapods

      - name: Install dependencies
        run: bun install

      - name: Create secrets.json
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          jq -n \
            --arg api_key "$POSTHOG_API_KEY" \
            --arg host "$POSTHOG_HOST" \
            '{POSTHOG_API_KEY: $api_key, POSTHOG_HOST: $host}' > secrets.json

      - name: Prebuild iOS
        run: bunx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Build Unsigned iOS App
        run: |
          set -o pipefail
          cd ios
          xcodebuild \
            -workspace Papillon.xcworkspace \
            -scheme Papillon \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      - name: Package Unsigned IPA
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Built .app bundle not found!"
            ls -la ios/build/Build/Products/Release-iphoneos/ || true
            exit 1
          fi
          mkdir -p release-ipa Payload
          cp -R "$APP_PATH" "Payload/$(basename "$APP_PATH")"
          zip -qry release-ipa/papillon-plus-ios-unsigned.ipa Payload

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: release-ios-ipa
          path: release-ipa/papillon-plus-ios-unsigned.ipa

  publish-release:
    if: github.repository == 'timpim-dev/Papillon-beta'
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: release-android-apks
          path: release-assets

      - name: Download Unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: release-ios-ipa
          path: release-assets

      - name: Determine release tag
        id: meta
        run: |
          APP_VER=$(jq -r '.version // "8.6.2"' package.json)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="v${APP_VER}-beta-${SHORT_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Papillon + ${{ steps.meta.outputs.tag }}
          make_latest: true
          files: |
            release-assets/papillon-plus-phone.apk
            release-assets/papillon-plus-wear.apk
            release-assets/papillon-plus-ios-unsigned.ipa
          body: |
            ## Papillon + ${{ steps.meta.outputs.tag }}
            - **Téléphone Android** : `papillon-plus-phone.apk`
            - **Montre Wear OS** : `papillon-plus-wear.apk` (installable directement depuis Paramètres → Montre & Mises à jour dans Papillon +)
            - **iPhone / iPad (iOS)** : `papillon-plus-ios-unsigned.ipa` (installable avec SideStore / AltStore / Sideloadly)
